name: 'ShipSmoke'
description: >
  Verify that release artifacts (zip, tar.gz, standalone binaries) really
  extract and run on the target OS, with PASS/FAIL reports and a job
  summary. Failed checks fail the job.
author: 'geyutu6755'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  config:
    description: 'Path to .shipsmoke.yml'
    required: false
    default: '.shipsmoke.yml'
  version:
    description: >
      shipsmoke release version to download and checksum-verify, e.g. v1.0.2
      (a full release tag — moving refs like v1 are rejected here). Use
      'latest' to resolve the newest release at run time. Ignored when
      `binary-path` is set.
    required: false
    default: 'latest'
  binary-path:
    description: >
      Use a shipsmoke binary already present on the runner (e.g. built in an
      earlier step) instead of downloading a release. Its integrity is then
      the caller's responsibility.
    required: false
    default: ''
  report:
    description: 'Where to write the JSON report (overrides the config file).'
    required: false
    default: 'shipsmoke-report.json'
  artifact:
    description: 'Verify only the artifact with this name (optional).'
    required: false
    default: ''
  allow-empty:
    description: 'Exit 0 even when no check was executed (default: exit 3).'
    required: false
    default: 'false'
  upload-report:
    description: 'Upload the JSON report as a workflow artifact.'
    required: false
    default: 'true'

outputs:
  report-path:
    description: 'Path of the JSON report file.'
    value: ${{ steps.run.outputs.report-path }}
  exit-code:
    description: 'shipsmoke exit code (0 pass, 1 fail, 2 usage, 3 nothing executed).'
    value: ${{ steps.run.outputs.exit-code }}
  verified:
    description: 'How the executed binary was verified: "checksum" or "user-provided".'
    value: ${{ steps.fetch.outputs.verified }}
  resolved-version:
    description: 'Release tag that was downloaded and verified, if any.'
    value: ${{ steps.fetch.outputs.version }}

# Security model of this composite action:
#   * user inputs reach shell scripts ONLY through environment variables
#     (GitHub expands `${{ }}` outside the shell; direct interpolation inside
#     a run block is script injection) — there is deliberately not a single
#     `${{ inputs.* }}` inside any run block below;
#   * downloaded release assets are SHA-256 verified against the release's
#     checksums.txt before extraction; any mismatch aborts the job before
#     the binary is ever executed.
runs:
  using: 'composite'
  steps:
    - name: 'Fetch and verify the shipsmoke binary'
      id: 'fetch'
      shell: bash
      env:
        SHIPS_VERSION: '${{ inputs.version }}'
        SHIPS_BINARY_PATH: '${{ inputs.binary-path }}'
      run: 'bash "$GITHUB_ACTION_PATH/scripts/fetch-shipsmoke.sh"'

    - name: 'Run shipsmoke check'
      id: 'run'
      shell: bash
      env:
        SHIPS_BIN: '${{ steps.fetch.outputs.path }}'
        SHIPS_CONFIG: '${{ inputs.config }}'
        SHIPS_ARTIFACT: '${{ inputs.artifact }}'
        SHIPS_REPORT: '${{ inputs.report }}'
        SHIPS_ALLOW_EMPTY: '${{ inputs.allow-empty }}'
      run: |
        set -euo pipefail
        ARGS=(check --config "$SHIPS_CONFIG")
        if [ -n "$SHIPS_ARTIFACT" ]; then
          ARGS+=(--artifact "$SHIPS_ARTIFACT")
        fi
        if [ -n "$SHIPS_REPORT" ]; then
          ARGS+=(--report "$SHIPS_REPORT")
        fi
        if [ "$SHIPS_ALLOW_EMPTY" = "true" ]; then
          ARGS+=(--allow-empty)
        fi
        set +e
        "$SHIPS_BIN" "${ARGS[@]}"
        CODE=$?
        set -e
        echo "exit-code=$CODE" >> "$GITHUB_OUTPUT"
        echo "report-path=$SHIPS_REPORT" >> "$GITHUB_OUTPUT"
        exit "$CODE"

    - name: 'Upload JSON report'
      if: ${{ always() && inputs.upload-report == 'true' && inputs.report != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: 'shipsmoke-report-${{ runner.os }}'
        path: ${{ inputs.report }}
        if-no-files-found: ignore
