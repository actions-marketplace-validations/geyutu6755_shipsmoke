name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify only, do not publish'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux/amd64, os: ubuntu-24.04, pkg: tar.gz }
          - { target: linux/arm64, os: ubuntu-24.04, pkg: tar.gz }
          - { target: darwin/amd64, os: macos-15, pkg: tar.gz }
          - { target: darwin/arm64, os: macos-15, pkg: tar.gz }
          - { target: windows/amd64, os: windows-2025, pkg: zip }
          - { target: windows/arm64, os: windows-2025, pkg: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          GOOS="${TARGET%%/*}"
          GOARCH="${TARGET##*/}"
          VERSION="${{ steps.ver.outputs.version }}"
          EXE=""
          [ "$GOOS" = "windows" ] && EXE=".exe"
          export CGO_ENABLED=0
          go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION -X main.commit=${GITHUB_SHA::7} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/shipsmoke_${GOOS}_${GOARCH}/shipsmoke${EXE}" ./cmd/shipsmoke

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          GOOS="${TARGET%%/*}"
          GOARCH="${TARGET##*/}"
          cd "dist/shipsmoke_${GOOS}_${GOARCH}"
          if [ "${{ matrix.pkg }}" = "zip" ]; then
            powershell -Command "Compress-Archive -Path shipsmoke.exe -DestinationPath ../shipsmoke_${GOOS}_${GOARCH}.zip -Force"
          else
            tar -czf "../shipsmoke_${GOOS}_${GOARCH}.tar.gz" shipsmoke
          fi
          cd ..
          # checksums
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "shipsmoke_${GOOS}_${GOARCH}.${{ matrix.pkg }}" > "shipsmoke_${GOOS}_${GOARCH}.${{ matrix.pkg }}.sha256"
          else
            powershell -Command "(Get-FileHash 'shipsmoke_${GOOS}_${GOARCH}.${{ matrix.pkg }}' -Algorithm SHA256).Hash.ToLower() + '  shipsmoke_${GOOS}_${GOARCH}.${{ matrix.pkg }}' | Out-File -Encoding ascii 'shipsmoke_${GOOS}_${GOARCH}.${{ matrix.pkg }}.sha256'"
          fi

      - name: Set up QEMU (executes the linux/arm64 artifact in a container)
        if: matrix.target == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Verify artifact runs before publishing
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          GOOS="${TARGET%%/*}"
          GOARCH="${TARGET##*/}"
          HOST_OS="$(go env GOHOSTOS)"
          HOST_ARCH="$(go env GOHOSTARCH)"
          EXT="tar.gz"
          [ "${{ matrix.pkg }}" = "zip" ] && EXT="zip"
          ENTRY="shipsmoke"
          [ "$GOOS" = "windows" ] && ENTRY="shipsmoke.exe"
          VERSION="${{ steps.ver.outputs.version }}"

          # Extract the packaged artifact once; every mode below runs the
          # extracted entry binary.
          rm -rf verify-out && mkdir -p verify-out
          if [ "$EXT" = "zip" ]; then
            if command -v unzip >/dev/null 2>&1; then
              unzip -q "dist/shipsmoke_${GOOS}_${GOARCH}.zip" -d verify-out
            else
              WZIP="$(cygpath -w "$PWD/dist/shipsmoke_${GOOS}_${GOARCH}.zip")"
              WOUT="$(cygpath -w "$PWD/verify-out")"
              powershell -NoProfile -Command "Expand-Archive -Path '$WZIP' -DestinationPath '$WOUT' -Force"
            fi
          else
            tar -xzf "dist/shipsmoke_${GOOS}_${GOARCH}.tar.gz" -C verify-out
          fi

          MODE="none"
          if [ "$GOOS" = "$HOST_OS" ] && [ "$GOARCH" = "$HOST_ARCH" ]; then
            MODE="native"
            "verify-out/$ENTRY" version | grep -q "$VERSION" || { echo "version output mismatch"; exit 1; }
          elif [ "$GOOS" = "linux" ] && [ "$GOARCH" = "arm64" ] && [ "$HOST_OS" = "linux" ]; then
            MODE="qemu-container"
            docker run --rm --platform linux/arm64 \
              -v "$PWD/verify-out:/mnt:ro" ubuntu:24.04 \
              /mnt/$ENTRY version | grep -q "$VERSION" || { echo "arm64 container execution failed"; exit 1; }
          elif [ "$GOOS" = "darwin" ] && [ "$GOARCH" = "amd64" ] && [ "$HOST_OS" = "darwin" ]; then
            MODE="rosetta"
            arch -x86_64 "verify-out/$ENTRY" version >/dev/null 2>&1 || \
              softwareupdate --install-rosetta --agree-to-license >/dev/null
            arch -x86_64 "verify-out/$ENTRY" version | grep -q "$VERSION" || { echo "Rosetta execution failed"; exit 1; }
          elif [ "$GOOS" = "windows" ] && [ "$GOARCH" = "arm64" ]; then
            MODE="build-only"
            echo "windows/arm64 cannot be executed on an x64 GitHub-hosted runner (no emulation available); recording as build-only, NOT as executed"
          fi

          if [ "$MODE" = "none" ]; then
            echo "no execution strategy for $TARGET on this runner"; exit 1
          fi
          echo "coverage: $TARGET → $MODE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "build-only" ]; then
            exit 0
          fi

          # Full shipsmoke self-verification wherever the binary can run:
          # a shipsmoke verifier of the TARGET architecture checks the
          # packaged artifact (native, in an arm64 container, or via Rosetta).
          case "$MODE" in
            native)         go build -o verifier ./cmd/shipsmoke; VERIFIER_CMD="./verifier" ;;
            qemu-container) CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o verifier-arm64 ./cmd/shipsmoke; VERIFIER_CMD="/work/verifier-arm64" ;;
            rosetta)        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o verifier-amd64 ./cmd/shipsmoke; VERIFIER_CMD="arch -x86_64 ./verifier-amd64" ;;
          esac
          # printf, not a heredoc: inside an indented YAML block scalar an
          # indented "EOF" terminator never closes the heredoc, which would
          # silently swallow the verify command below (v1.0.1 bug).
          printf 'version: 1\nartifacts:\n  - name: shipsmoke-%s-%s\n    path: dist/shipsmoke_%s_%s.%s\n    binary: %s\n    runs_on: [%s/%s]\n    checks:\n      - args: ["version"]\n        expect:\n          exit_code: 0\n          stdout_contains: ["%s"]\n' \
            "$GOOS" "$GOARCH" "$GOOS" "$GOARCH" "$EXT" "$ENTRY" "$GOOS" "$GOARCH" "$VERSION" > .shipsmoke-release.yml
          cat .shipsmoke-release.yml
          if [ "$MODE" = "native" ]; then
            $VERIFIER_CMD check --config .shipsmoke-release.yml
          elif [ "$MODE" = "qemu-container" ]; then
            docker run --rm --platform linux/arm64 \
              -v "$PWD:/work" -w /work ubuntu:24.04 \
              $VERIFIER_CMD check --config .shipsmoke-release.yml
          else
            $VERIFIER_CMD check --config .shipsmoke-release.yml
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipsmoke-${{ matrix.os }}-${{ strategy.job-index }}
          path: dist/shipsmoke_*
          retention-days: 7

  release:
    needs: build
    if: github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == 'false')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: shipsmoke-*
          merge-multiple: true

      - name: Collect release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name 'shipsmoke_*' \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} release/ \;
          cd release
          # Combined checksums.txt from the per-file .sha256 files
          cat *.sha256 | grep -v '^$' > checksums.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: .github/RELEASE_BODY.md
          generate_release_notes: true
          fail_on_unmatched_files: true
